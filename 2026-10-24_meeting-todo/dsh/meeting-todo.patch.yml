# DSH 自定义 Agent Preset：会议纪要 → 今日待办
# 格式依据：@deepseek-ai/dsh-agent-preset 包 README（YAML 行：name + config.id + config.plugins）
# 插件列表沿用第2期 downloads-organize.patch.yml（从 dsh 0.2.0-rc.2 standard preset 精简）
# 用法：dsh web --patch ./meeting-todo.patch.yml
- insert:
    - id: preset-meeting-todo
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: meeting-todo
        name: 会议纪要→今日待办
        description: 读工作区会议纪要，写摘要与按高中低分组的今日待办；负责人未明单列待确认；不改原件。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你负责把会议纪要整理成今日待办。硬规矩：处理当前工作区里今天的会议纪要（录音转写稿、txt、md 都算，文件可能散落、未分类）；
                如需整理可自行创建 meetings/raw、meetings/summaries、tasks 等目录，原件归到 raw（或等价位置），不要改原件内容；
                每场会议写一份简洁摘要到 meetings/summaries/（同名 .md）；
                把所有行动项提取到 tasks/今日待办.md；
                按【高】【中】【低】分组，每条写事项/负责人/截止时间（没提到就写「未提及」）/来源会议；
                高＝卡住别人或本周硬截止，中＝重要但时间灵活，低＝最好做但无直接依赖；
                负责人没说清的单列「待确认」，不要猜；不要修改或删除任何原始纪要/录音转写稿的正文；
                完成后把待办清单直接展示给我。
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
